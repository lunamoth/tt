<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:;">
    <title>✂️ 타래 재단사 - 블루스카이, 트위터, 스레드를 위한 긴 글 자르기, 타래 생성기</title>
    
    <!-- Pretendard Font for non-Windows platforms to maintain clean look -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.8/static/pretendard.css" />

    <style>
        /* 
         * Windows 11 Fluent Design System (WinUI 3) Implementation 
         */

        :root {
            /* Typography */
            --font-family: 'Segoe UI Variable', 'Segoe UI', 'Pretendard', -apple-system, sans-serif;
            
            /* Sizing */
            --app-base-size: 18px;
            --button-scale: 1.5;
            --radius-control: 4px;
            --radius-layer: 8px;
            --radius-window: 12px;

            /* Light Theme Tokens (WinUI 3 Default) */
            --mica-bg: #f3f3f3; /* Mica Alt */
            --layer-fill: #ffffff;
            --layer-fill-secondary: #f9f9f9;
            
            --text-primary: #1b1b1b;
            --text-secondary: #5d5d5d;
            --text-tertiary: #838383;
            --text-disabled: #a6a6a6;

            --accent-default: #0067c0;
            --accent-hover: #1975c5;
            --accent-active: #2b88d8;
            --accent-text: #ffffff;

            --control-fill: #ffffff; /* Input background */
            --control-fill-secondary: #f6f6f6; /* Button background */
            --control-fill-hover: #f0f0f0;
            --control-fill-active: #e4e4e4;
            
            --stroke-card: rgba(0, 0, 0, 0.0578);
            --stroke-control: rgba(0, 0, 0, 0.0578);
            --stroke-control-strong: rgba(0, 0, 0, 0.4458); /* Bottom border of inputs */

            --focus-stroke: #1a1a1a;

            --shadow-flyout: 0 8px 16px rgba(0, 0, 0, 0.14);
            --shadow-card: 0 2px 4px rgba(0, 0, 0, 0.025);
        }

        [data-theme="dark"] {
            /* Dark Theme Tokens */
            --mica-bg: #202020;
            --layer-fill: #2c2c2c;
            --layer-fill-secondary: #323232;
            
            --text-primary: #ffffff;
            --text-secondary: #d0d0d0;
            --text-tertiary: #9d9d9d;
            --text-disabled: #5c5c5c;

            --accent-default: #4cc2ff;
            --accent-hover: #4cc2ff; /* WinUI lightens accent on hover in dark mode usually, keeping solid for contrast */
            --accent-active: #3aa0d9;
            --accent-text: #000000;

            --control-fill: #333333; /* Text Box */
            --control-fill-secondary: #3a3a3a; /* Button */
            --control-fill-hover: #424242;
            --control-fill-active: #2f2f2f;

            --stroke-card: rgba(0, 0, 0, 0.2); /* Invisible mostly, but useful for definition */
            --stroke-control: rgba(255, 255, 255, 0.0698);
            --stroke-control-strong: rgba(255, 255, 255, 0.5442);

            --focus-stroke: #ffffff;
            
            --shadow-flyout: 0 8px 16px rgba(0, 0, 0, 0.26);
            --shadow-card: 0 2px 4px rgba(0, 0, 0, 0.13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: var(--app-base-size);
        }

        body {
            font-family: var(--font-family);
            background-color: var(--mica-bg);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
            user-select: none;
        }

        /* Custom Scrollbar (Win 11 Style) */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 10px;
            border: 4px solid transparent;
            background-clip: content-box;
            transition: background-color 0.2s;
        }
        :hover::-webkit-scrollbar-thumb { background-color: var(--text-tertiary); }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 0; /* Remove padding to simulate window edge */
        }

        /* Allow selection */
        .container * { user-select: text; }
        button, label, select, .preset-btn { user-select: none; }

        /* Header Area */
        header {
            padding: 1.5rem 2rem 1rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        h1 {
            font-size: 1.5rem; /* Title Large */
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            letter-spacing: -0.015em;
        }

        p.subtitle {
            font-size: 0.875rem; /* Body */
            color: var(--text-secondary);
            font-weight: 400;
        }

        p.subtitle a {
            color: var(--accent-default);
            text-decoration: none;
            border-radius: 2px;
        }
        p.subtitle a:hover { text-decoration: underline; }

        /* Theme Toggle as Command Bar Button */
        .theme-toggle-btn {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            width: calc(2.25rem * var(--button-scale));
            height: calc(2.25rem * var(--button-scale));
            background: transparent;
            border: none;
            border-radius: var(--radius-control);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(1rem * var(--button-scale));
            color: var(--text-primary);
            transition: background 0.1s;
        }
        .theme-toggle-btn:hover { background-color: rgba(128, 128, 128, 0.1); }
        .theme-toggle-btn:active { background-color: rgba(128, 128, 128, 0.2); transform: scale(0.96); }

        /* Main Content Layout */
        .layout-wrapper {
            display: flex;
            gap: 16px; /* WinUI standard gap */
            flex: 1;
            overflow: hidden;
            padding: 0 2rem 1rem 2rem;
        }

        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-radius: var(--radius-layer);
            /* Padding for scrollbar space */
            padding-right: 4px; 
        }

        /* Right Panel mimics a 'Card' or 'Surface' */
        .right-panel {
            background: var(--layer-fill);
            border: 1px solid var(--stroke-card);
            padding: 1.5rem;
            box-shadow: var(--shadow-card);
        }

        /* Preset Buttons (Toggle Button Style) */
        .preset-wrapper { margin-bottom: 1.5rem; }
        .preset-wrapper label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .preset-btn {
            background: var(--control-fill-secondary);
            border: 1px solid var(--stroke-control);
            border-bottom: 1px solid var(--stroke-control);
            border-radius: var(--radius-control);
            padding: calc(0.45rem * var(--button-scale)) calc(0.35rem * var(--button-scale));
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(2px * var(--button-scale));
            position: relative;
            min-width: 0;
            text-align: center;
            line-height: 1.15;
        }

        .preset-btn .preset-title {
            display: block;
            font-size: clamp(0.82rem, 1.2vw, calc(0.72rem * var(--button-scale)));
            font-weight: 600;
            white-space: nowrap;
        }

        .preset-btn .preset-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: calc(4px * var(--button-scale));
            font-size: clamp(0.62rem, 0.85vw, calc(0.46rem * var(--button-scale)));
            white-space: nowrap;
        }
        
        .preset-btn:hover { background-color: var(--control-fill-hover); }
        .preset-btn:active { background-color: var(--control-fill-active); transform: scale(0.98); color: var(--text-secondary); }

        /* Active state mimics WinUI ToggleButton:Checked */
        .preset-btn.active {
            background-color: var(--control-fill-secondary); 
            background-image: linear-gradient(to bottom, transparent, rgba(0,0,0,0.02));
            border-color: var(--stroke-control);
            /* WinUI Accent Indicator logic */
        }
        .preset-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 12px; right: 12px;
            height: 3px;
            background-color: var(--accent-default);
            border-radius: 2px 2px 0 0;
        }
        [data-theme="dark"] .preset-btn.active { background-color: rgba(255,255,255,0.08); }

        .preset-btn span.limit-badge {
            font-size: inherit;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 0;
        }

        /* Keyboard Hint Style */
        .kbd-hint {
            font-size: 0.7em;
            color: var(--text-tertiary);
            margin-left: 4px;
            font-weight: normal;
            opacity: 0.7;
            font-family: Consolas, 'Courier New', monospace;
            display: inline-block;
        }
        
        /* Controls Grid */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 1.5rem;
        }

        .input-group { display: flex; flex-direction: column; }
        .input-group label {
            font-size: 0.875rem;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-weight: 400;
        }

        /* WinUI 3 TextBox & ComboBox Style */
        input[type="number"], 
        input[type="text"],
        select, textarea {
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text-primary);
            background-color: var(--control-fill);
            border: 1px solid var(--stroke-control);
            border-bottom: 1px solid var(--stroke-control-strong);
            border-radius: var(--radius-control);
            outline: none;
            transition: background 0.1s, border-color 0.1s;
        }

        input[type="number"], input[type="text"], select { height: 32px; padding: 0 10px; }
        
        /* WinUI Hover State */
        input:hover, select:hover, textarea:hover {
            background-color: var(--control-fill-hover);
        }

        /* WinUI Focus State (Bottom Accent Bar is simulated via border-bottom) */
        input:focus, select:focus, textarea:focus {
            background-color: var(--control-fill);
            border-bottom: 2px solid var(--accent-default);
            border-left-color: var(--stroke-control);
            border-right-color: var(--stroke-control);
            border-top-color: var(--stroke-control);
        }

        select {
            cursor: pointer;
            appearance: none;
            padding-right: 2rem;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.5 4.5L6 8L9.5 4.5' stroke='%235D5D5D' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        [data-theme="dark"] select {
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.5 4.5L6 8L9.5 4.5' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
        }

        #customFormatInput { margin-top: 8px; display: none; }
        #customFormatInput.show { display: block; animation: fadeIn 0.2s; }

        /* TextArea - The main input */
        textarea {
            flex: 1;
            width: 100%;
            min-height: 200px;
            padding: 12px;
            line-height: 1.5;
            resize: none;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-card);
        }
        
        textarea.drag-over {
            background-color: var(--control-fill-secondary);
            border: 2px dashed var(--accent-default);
        }

        /* Action Area */
        .action-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
        }

        .action-area > :first-child {
            flex: 1 1 0;
            min-width: 0;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            flex: 2 1 0;
            min-width: 0;
        }

        .buttons-group button {
            padding: calc(0.25rem * var(--button-scale)) calc(0.3rem * var(--button-scale));
            min-height: calc(34px * var(--button-scale));
        }

        .char-count { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; }
        #twitterCount, #bskyCount { font-size: 0.75rem; font-weight: 600; margin-top: 4px; }

        /* WinUI Standard Button */
        button {
            height: calc(32px * var(--button-scale));
            border-radius: var(--radius-control);
            padding: 0 calc(16px * var(--button-scale));
            font-size: calc(0.875rem * var(--button-scale));
            font-family: inherit;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: calc(8px * var(--button-scale));
            font-weight: 400;
        }

        button.reset-btn, button.file-btn, button.download-btn, button.copy-all-btn {
            background-color: var(--control-fill-secondary);
            color: var(--text-primary);
            border: 1px solid var(--stroke-control);
            border-bottom: 1px solid var(--stroke-control-strong);
        }

        button.reset-btn:hover, button.file-btn:hover, button.download-btn:hover, button.copy-all-btn:hover {
            background-color: var(--control-fill-hover);
        }
        button.reset-btn:active, button.file-btn:active, button.download-btn:active, button.copy-all-btn:active {
            background-color: var(--control-fill-active);
            color: var(--text-secondary);
            transform: scale(0.98);
        }

        /* WinUI Accent Button */
        button.split-btn, .copy-btn {
            background-color: var(--accent-default);
            color: var(--accent-text);
            border: 1px solid transparent; /* Accent buttons usually borderless or same color */
            border-bottom: 1px solid rgba(0,0,0,0.1); 
        }
        
        button.split-btn:hover, .copy-btn:hover { background-color: var(--accent-hover); }
        button.split-btn:active, .copy-btn:active { 
            background-color: var(--accent-active); 
            color: rgba(255,255,255,0.8);
            transform: scale(0.98);
        }

        .results-header-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 1rem;
        }
        .copy-all-btn, .download-btn { flex: 1; }

        .buttons-group button,
        .results-header-actions button {
            height: auto;
            flex-direction: column;
            gap: calc(2px * var(--button-scale));
            text-align: center;
            line-height: 1.1;
            min-width: 0;
            white-space: normal;
        }

        .results-header-actions button {
            padding: calc(0.25rem * var(--button-scale)) calc(0.45rem * var(--button-scale));
            min-height: calc(34px * var(--button-scale));
        }

        .buttons-group button .btn-title,
        .results-header-actions button .btn-title {
            display: block;
            font-size: clamp(0.82rem, 1.1vw, calc(0.72rem * var(--button-scale)));
            font-weight: 600;
            white-space: nowrap;
        }

        .buttons-group button .btn-meta,
        .results-header-actions button .btn-meta {
            display: block;
            font-size: clamp(0.62rem, 0.85vw, calc(0.46rem * var(--button-scale)));
            line-height: 1;
            opacity: 0.82;
            white-space: nowrap;
        }

        /* Result Cards */
        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 1rem;
        }
        
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-disabled);
            font-size: 0.9rem;
            text-align: center;
            min-height: 200px;
        }

        .tweet-card {
            background-color: var(--layer-fill-secondary); /* Slight contrast against card bg */
            border: 1px solid var(--stroke-card);
            border-radius: var(--radius-layer);
            padding: 16px;
            position: relative;
            animation: fadeIn 0.3s cubic-bezier(0,0,0,1);
        }
        /* Dark mode needs differentiation for nested card */
        [data-theme="dark"] .tweet-card {
            background-color: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .tweet-card.warning { border: 1px solid #fce100; }

        .mockup-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }

        .mockup-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background-color: var(--control-fill);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 1px solid var(--stroke-control);
        }

        .mockup-info { display: flex; flex-direction: column; }
        .mockup-name { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); }
        .mockup-handle { font-size: 0.8rem; color: var(--text-secondary); }

        .card-meta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--stroke-control);
        }

        .badge {
            background-color: rgba(16, 124, 16, 0.1);
            color: #107c10;
            padding: 2px 8px;
            border-radius: var(--radius-control);
            font-size: 0.75rem;
            font-weight: 600;
        }
        [data-theme="dark"] .badge { color: #6ccb5f; background-color: rgba(108, 203, 95, 0.15); }
        .badge.warn { background-color: rgba(255, 185, 0, 0.15); color: #8a6d0b; }
        [data-theme="dark"] .badge.warn { color: #ffd337; }

        .card-content {
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* Copy Button inside card (Win11 accent button style, size preserved) */
        .copy-btn {
            width: 100%;
            height: calc(32px * var(--button-scale));
            font-size: calc(0.78rem * var(--button-scale));
            font-weight: 600;
        }
        .copy-btn:focus-visible {
            outline: 2px solid var(--accent-default);
            outline-offset: 2px;
        }
        
        .copy-btn.copied {
            color: #ffffff;
            background-color: var(--accent-default);
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        [data-theme="dark"] .copy-btn.copied {
            color: #ffffff;
            background-color: var(--accent-default);
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(0,0,0,0.24);
        }

        /* Status Bar (Notepad/VSCode style) */
        .status-bar {
            background: var(--mica-bg); /* Match window bg */
            padding: 4px 2rem;
            border-top: 1px solid rgba(0,0,0,0.05); /* Very subtle separator */
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: flex-end;
            gap: 24px;
            flex-shrink: 0;
            height: 32px;
            align-items: center;
        }

        .status-item { display: flex; align-items: center; gap: 6px; }
        .status-item span { color: var(--text-primary); }

        /* Toast (Teaching Tip / Notification style) */
        #toast {
            visibility: hidden;
            min-width: 300px;
            background-color: var(--layer-fill); /* Acrylic usually, but solid for web */
            color: var(--text-primary);
            border: 1px solid var(--stroke-card);
            border-radius: var(--radius-layer);
            padding: 12px 16px;
            position: fixed;
            z-index: 999;
            left: 50%;
            bottom: 48px;
            transform: translateX(-50%) translateY(20px);
            font-size: 0.9rem;
            font-weight: 400;
            box-shadow: var(--shadow-flyout);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0,0,0,1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }
        
        /* WinUI colored accent bar on left */
        #toast::before {
            content: '';
            position: absolute;
            left: 6px; top: 12px; bottom: 12px;
            width: 3px;
            background-color: var(--accent-default);
            border-radius: 2px;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Win11 shell refinement (full-size layout) */
        :root {
            --app-base-size: 18px;
            --button-scale: 1.5;
            --radius-control: 4px;
            --radius-layer: 8px;
            --radius-window: 12px;
            --shell-fill: #f3f3f3;
            --shell-header: rgba(255, 255, 255, 0.78);
            --pane-fill: rgba(255, 255, 255, 0.76);
            --status-fill: rgba(255, 255, 255, 0.84);
            --shell-border: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --shell-fill: #202020;
            --shell-header: rgba(39, 39, 39, 0.9);
            --pane-fill: rgba(45, 45, 45, 0.86);
            --status-fill: rgba(32, 32, 32, 0.92);
            --shell-border: rgba(255, 255, 255, 0.1);
        }

        @supports (color: AccentColor) {
            :root {
                --accent-default: AccentColor;
                --accent-hover: color-mix(in srgb, AccentColor 90%, white 10%);
                --accent-active: color-mix(in srgb, AccentColor 84%, black 16%);
            }
        }

        body {
            padding: 0;
            align-items: stretch;
            justify-content: stretch;
            background:
                radial-gradient(circle at 10% 16%, rgba(73, 132, 255, 0.12), transparent 42%),
                radial-gradient(circle at 88% 84%, rgba(0, 120, 215, 0.11), transparent 44%),
                var(--shell-fill);
        }

        .container {
            width: 100%;
            height: 100%;
            margin: 0;
            border-radius: 0;
            border: 1px solid var(--shell-border);
            border-left: none;
            border-right: none;

        .theme-toggle-btn {

        }

        .theme-toggle-btn:active {
            background-color: rgba(128, 128, 128, 0.2);
            transform: scale(0.96);
        }

        .layout-wrapper {
            gap: 14px;
            padding: 0.9rem 1.4rem 0.9rem 1.4rem;

        .left-panel,
        .right-panel {
            background: var(--pane-fill);

            backdrop-filter: blur(18px) saturate(120%);

        [data-theme="dark"] .left-panel,
        [data-theme="dark"] .right-panel {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .right-panel {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 10px 26px rgba(0, 0, 0, 0.08);
        }

        .preset-btn,
        button.reset-btn,
        button.file-btn,
        button.download-btn,
        button.copy-all-btn {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34);
        }

        input[type="number"],
        input[type="text"],
        select,
        textarea {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
        }

        textarea {
            border-radius: 8px;
        }

        button.split-btn,
        .copy-btn {
            background-image: linear-gradient(180deg, color-mix(in srgb, var(--accent-default) 91%, white 9%), var(--accent-default));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .tweet-card {
            border-radius: 12px;
            background: linear-gradient(180deg, var(--layer-fill) 0%, var(--layer-fill-secondary) 100%);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);

            background: var(--status-fill);

            gap: 0.5rem;
            justify-content: flex-end;
            flex-wrap: wrap;
            backdrop-filter: blur(14px);
        }

        .status-item {
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--stroke-control);
            background: var(--control-fill-secondary);
            font-size: 0.73rem;
        }

        #toast {
            min-width: 320px;
            left: auto;
            right: 18px;
            bottom: 18px;
            transform: translateY(14px);
            background: var(--pane-fill);
            border-radius: 10px;
            padding: 12px 16px 12px 20px;
            backdrop-filter: blur(20px) saturate(120%);
        }

        #toast.show {
            transform: translateY(0);
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        .preset-btn:focus-visible {
            outline: 2px solid var(--accent-default);
            outline-offset: 2px;
        }

        .preset-btn .kbd-hint,
        .buttons-group .kbd-hint,
        .results-header-actions .kbd-hint {
            font-size: inherit;

        }

        @media (max-width: 1100px) {
            .layout-wrapper {
                flex-direction: column;

                padding: 0.8rem 1rem 0.9rem 1rem;

                padding: 0.95rem 1rem 0.85rem 1rem;

                right: 1rem;

            p.subtitle {

                padding-right: 0.9rem;
