        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="appTitle">✂️ 타래 재단사</h1>
            <p class="subtitle">긴 글을 🔒서버 전송 없이 안전하게 타래로 재단해드려요. (제작: @lunamoth & Gemini 3.0 Pro | <a href="https://github.com/lunamoth/tt" target="_blank" rel="noopener noreferrer">소스 코드</a>)</p>
            <button class="theme-toggle-btn" id="themeToggle" aria-label="다크 모드 전환" title="다크 모드 전환 (Alt + D)">
                🌙
            </button>
        </header>

        <div class="layout-wrapper">
            <!-- 왼쪽 패널: 입력 및 설정 -->
            <div class="left-panel">
                
                <div class="preset-wrapper">
                    <label>✨ 플랫폼 선택 (자동 설정)</label>
                    <div class="preset-buttons" id="presetContainer">
                        <button id="btn-bluesky" class="preset-btn active" data-preset="bluesky">
                            <span class="preset-title">🦋 블루스카이</span>
                            <span class="preset-meta"><span class="limit-badge">(300자)</span> <span class="kbd-hint">Alt+B</span></span>
                        </button>
                        <button id="btn-twitter" class="preset-btn" data-preset="twitter">
                            <span class="preset-title">🐦 트위터</span>
                            <span class="preset-meta"><span class="limit-badge">(280자)</span> <span class="kbd-hint">Alt+X</span></span>
                        </button>
                        <button id="btn-threads" class="preset-btn" data-preset="threads">
                            <span class="preset-title">🧵 스레드</span>
                            <span class="preset-meta"><span class="limit-badge">(500자)</span> <span class="kbd-hint">Alt+T</span></span>
                        </button>
                    </div>
                </div>

                <div class="controls" id="controlsContainer">
                    <div class="input-group">
                        <label for="limit">📏 제한 글자수</label>
                        <input type="number" id="limit" value="300" min="10" max="2000">
                    </div>

                    <div class="input-group">
                        <label for="numberFormat">🔢 번호 서식</label>
                        <select id="numberFormat">
                            <option value="thread" selected>(🧵1/n)</option>
                            <option value="memo">(📝1/n)</option>
                            <option value="finger">(👇1/n)</option>
                            <option value="google">구글 트위터 방식</option>
                            <option value="korean_cont">(위에서 이어짐) (계속)</option>
                            <option value="bracket">[1/n]</option>
                            <option value="simple">1/n</option>
                            <option value="paren">(1/n)</option>
                            <option value="link_bottom">링크 하단</option>
                            <option value="custom">직접 입력...</option>
                        </select>
                        <input type="text" id="customFormatInput" placeholder="예: {current}/{total} 페이지">
                    </div>
                    
                    <div class="input-group">
                        <label for="position">📍 번호 위치</label>
                        <select id="position">
                            <option value="front">글 앞 (🧵1/n)</option>
                            <option value="back" selected>글 뒤 (🧵1/n)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="paragraphMode">📄 문단 유지</label>
                        <select id="paragraphMode">
                            <option value="on" selected>켜기 (기본)</option>
                            <option value="off">끄기 (꽉 채우기)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="urlMode">🔗 URL 단축</label>
                        <select id="urlMode">
                            <option value="off" selected>사용 안 함</option>
                            <option value="twitter">23자로 계산 (t.co)</option>
                            <option value="bluesky">스마트 단축 (Bluesky)</option>
                        </select>
                    </div>
                </div>

                <textarea id="inputText" maxlength="50000" placeholder="여기에 긴 글을 붙여넣거나 .txt 파일을 드래그하세요... 📝&#10;나머지는 제가 알아서 할게요!"></textarea>

                <div class="action-area">
                    <div style="display: flex; flex-direction: column; gap: 2px;">
                        <div class="char-count" id="totalCount">현재: 0자</div>
                        <div id="twitterCount" style="color: #1d9bf0; display: none;">🐦 트위터: 0자</div>
                        <div id="bskyCount" style="color: #0085ff; display: none;">🦋 블루스카이: 0자</div>
                    </div>
                    <div class="buttons-group">
                        <input type="file" id="fileInput" hidden accept=".txt,text/plain">
                        <button class="file-btn" id="btn-file"><span class="btn-title">📂 파일</span><span class="btn-meta"><span class="kbd-hint">Ctrl+O</span></span></button>
                        <button class="reset-btn" id="btn-reset"><span class="btn-title">🔄 초기화</span><span class="btn-meta"><span class="kbd-hint">Alt+Del</span></span></button>
                        <button class="split-btn" id="btn-split"><span class="btn-title">자르기 ⚡️</span><span class="btn-meta"><span class="kbd-hint">Ctrl+Enter</span></span></button>
                    </div>
                </div>
            </div>

            <!-- 오른쪽 패널: 결과 영역 -->
            <div class="right-panel">
                <div class="results" id="resultsArea">
                    <div class="empty-state">
                        <div>왼쪽에 글을 입력하면<br>여기에 결과가 표시됩니다.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 상태 표시줄 -->
        <div class="status-bar" id="statusBar">
            <div class="status-item">📊 글자 수: <span>0자</span></div>
            <div class="status-item">📝 단어 수: <span>0개</span></div>
            <div class="status-item">📑 줄 수: <span>0줄</span></div>
            <div class="status-item">¶ 문단 수: <span>0개</span></div>
            <div class="status-item">⏱️ 예상 읽기: <span>0초</span></div>
            <div class="status-item">🧵 생성된 타래: <span>0개</span></div>
        </div>

    </div>

    <div id="toast">✅ 복사 완료!</div>

    <script>
        (function() {
            "use strict";

            // 1. 상수 및 설정 관리
            const CONFIG = {
                VERSION: "타래 재단사 8.4 - 블루스카이, 트위터, 스레드를 위한 긴 글 자르기, 타래 생성기",
                STORAGE_KEY: "threadTailorSettings",
                DRAFT_KEY: "threadTailorDraft",
                LIMITS: { MIN: 10, MAX: 2000, BLUESKY: 300, TWITTER: 280, THREADS: 500 },
                URL_WEIGHTS: {
                    TWITTER: 23,
                    BSKY_ADDED_LEN: 16
                },
                DEBOUNCE_MS: 500,
                LOOP_LIMIT: 5,
                TIMEOUT_MS: 3000, 
                MESSAGES: {
                    EMPTY_STATE: "왼쪽에 글을 입력하면<br>여기에 결과가 표시됩니다.",
                    EMPTY_INPUT: "⚠️ 텍스트를 입력해주세요!",
                    LIMIT_ERROR: "⚠️ 최소 10자 이상 설정해주세요!",
                    RESET_CONFIRM: "모든 내용을 지우고 초기화하시겠습니까?",
                    RESET_DONE: "🗑️ 초기화되었습니다.",
                    SETTINGS_DONE: "자 설정 완료",
                    SPLIT_DONE: "🎉 자르기 완료! 첫 번째 글이 복사되었어요 📋",
                    COPY_ALL: "📑 전체 복사",
                    SAVE_FILE: "💾 저장",
                    COPY_BTN: "📋 복사하기",
                    COPIED: "✅ 복사됨!",
                    FAIL: "❌ 복사 실패 (권한 확인 필요)",
                    CLIPBOARD_SUCCESS: "✨ 클립보드에 복사되었어요!",
                    FILE_ERROR: "❌ 텍스트 파일(.txt)만 읽을 수 있습니다.",
                    STORAGE_ERROR: "⚠️ 설정 저장 실패 (공간 부족/프라이버시 모드)",
                    UNBREAKABLE: "⚠️ 너무 긴 단어/URL이 있어 강제로 잘랐습니다."
                }
            };

            // 2. DOM 관리 도우미
            class DOMHelper {
                static getElements() {
                    return {
                        html: document.documentElement,
                        appTitle: document.getElementById('appTitle'),
                        inputText: document.getElementById('inputText'),
                        limitInput: document.getElementById('limit'),
                        positionSelect: document.getElementById('position'),
                        paragraphModeSelect: document.getElementById('paragraphMode'),
                        numberFormatSelect: document.getElementById('numberFormat'),
                        customFormatInput: document.getElementById('customFormatInput'),
                        urlModeSelect: document.getElementById('urlMode'),
                        resultsArea: document.getElementById('resultsArea'),
                        totalCount: document.getElementById('totalCount'),
                        bskyCount: document.getElementById('bskyCount'),
                        twitterCount: document.getElementById('twitterCount'),
                        toast: document.getElementById('toast'),
                        presetContainer: document.getElementById('presetContainer'),
                        controlsContainer: document.getElementById('controlsContainer'),
                        btnReset: document.getElementById('btn-reset'),
                        btnSplit: document.getElementById('btn-split'),
                        btnFile: document.getElementById('btn-file'),
                        fileInput: document.getElementById('fileInput'),
                        themeToggle: document.getElementById('themeToggle'),
                        statusBar: document.getElementById('statusBar')
                    };
                }

                static createElement(tag, className, textContent = '') {
                    const el = document.createElement(tag);
                    if (className) el.className = className;
                    if (textContent) el.textContent = textContent;
                    return el;
                }

                static setText(el, text) {
                    if (el && el.textContent !== text) el.textContent = text;
                }

                static setStyle(el, prop, value) {
                    if (el && el.style[prop] !== value) el.style[prop] = value;
                }

                static setClass(el, className, add) {
                    if (!el) return;
                    if (add && !el.classList.contains(className)) el.classList.add(className);
                    else if (!add && el.classList.contains(className)) el.classList.remove(className);
                }

                static createCard(chunk, metaInfo) {
                    const { content, current, realLen, weightLen, isUnbreakable, urlMode } = metaInfo;
                    const card = this.createElement('div', `tweet-card${isUnbreakable ? ' warning' : ''}`);
                    
                    const header = this.createElement('div', 'mockup-header');
                    const avatar = this.createElement('div', 'mockup-avatar', '👤');
                    const info = this.createElement('div', 'mockup-info');
                    const name = this.createElement('div', 'mockup-name', '나의 타래');
                    const handle = this.createElement('div', 'mockup-handle', '@thread_tailor');
                    info.append(name, handle);
                    header.append(avatar, info);

                    const meta = this.createElement('div', 'card-meta-header');
                    const badge = this.createElement('span', `badge${isUnbreakable ? ' warn' : ''}`, 
                        isUnbreakable ? `Part ${current} ⚠️` : `Part ${current}`);
                    
                    let lenText = `${realLen}자`;
                    if (urlMode !== 'off' && realLen !== weightLen) {
                        lenText = `${weightLen}자 (실제 ${realLen})`;
                    }
                    const lenSpan = this.createElement('span', '', lenText);
                    lenSpan.style.fontSize = '0.85rem';
                    lenSpan.style.color = 'var(--text-secondary)';
                    meta.append(badge, lenSpan);

                    const body = this.createElement('div', 'card-content', content);
                    const btn = this.createElement('button', 'copy-btn', CONFIG.MESSAGES.COPY_BTN);
                    btn.dataset.content = content;

                    card.append(header, meta, body, btn);
                    return card;
                }
            }

            // 3. 클립보드 매니저
            class ClipboardManager {
                static async copy(text, triggerBtn) {
                    if (!text) return;
                    let success = false;
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
                            await navigator.clipboard.writeText(text);
                            success = true;
                        } else {
                            throw new Error("Clipboard API unavailable");
                        }
                    } catch (err) {
                        success = this.fallbackCopy(text);
                    }

                    if (success) this.showSuccess(triggerBtn);
                    else AppController.showToast(CONFIG.MESSAGES.FAIL);
                }

                static fallbackCopy(text) {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    textArea.style.top = "0";
                    textArea.setAttribute("readonly", "");
                    document.body.appendChild(textArea);
                    
                    if (navigator.userAgent.match(/ipad|iphone/i)) {
                        const range = document.createRange();
                        range.selectNodeContents(textArea);
                        const selection = window.getSelection();
                        selection.removeAllRanges();
                        selection.addRange(range);
                        textArea.setSelectionRange(0, 999999);
                    } else {
                        textArea.select();
                    }

                    let success = false;
                    try { success = document.execCommand('copy'); } catch (err) { success = false; }
                    document.body.removeChild(textArea);
                    return success;
                }

                static showSuccess(btn) {
                    if (!btn) {
                        AppController.showToast(CONFIG.MESSAGES.CLIPBOARD_SUCCESS);
                        return;
                    }
                    const originalText = btn.textContent;
                    btn.classList.add('copied');
                    btn.textContent = CONFIG.MESSAGES.COPIED;
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        if (originalText.includes('📋') || originalText === CONFIG.MESSAGES.COPY_BTN) {
                            btn.textContent = CONFIG.MESSAGES.COPY_BTN;
                        } else {
                            btn.textContent = originalText;
                        }
                    }, 2000);
                    AppController.showToast(CONFIG.MESSAGES.CLIPBOARD_SUCCESS);
                }
            }

            // 4. 텍스트 처리 엔진
            class TextEngine {
                static init() {
                    this.segmenter = new Intl.Segmenter('ko', { granularity: 'grapheme' });
                    this.REGEX_OBJ = {
                        URL_GLOBAL: /https?:\/\/[^\s]+(?<![.,?!:;])/g,
                        BLUESKY_LINK: /(^|\s|\()((https?:\/\/[^\s]+)|(([a-z][a-z0-9]*(?:\.[a-z0-9]+)+)[^\s]*))/gim
                    };
                }

                static countGraphemes(text) {
                    let count = 0;
                    const iterator = this.segmenter.segment(text)[Symbol.iterator]();
                    while (!iterator.next().done) count++;
                    return count;
                }

                static countBlueskyGraphemes(text) {
                    let processed = text.replace(this.REGEX_OBJ.BLUESKY_LINK, (match, p1, p2) => {
                        let cleanUrl = p2.replace(/^https?:\/\//i, '');
                        let fullLen = this.countGraphemes(cleanUrl);
                        
                        const domain = cleanUrl.split('/')[0];
                        const domainLen = this.countGraphemes(domain);
                        const shortenedLen = domainLen + CONFIG.URL_WEIGHTS.BSKY_ADDED_LEN;
                        
                        const finalLen = (fullLen < shortenedLen) ? fullLen : shortenedLen;
                        return p1 + "x".repeat(finalLen);
                    });
                    return this.countGraphemes(processed);
                }

                static isTwitterWeightOne(code) {
                    return (code >= 0 && code <= 4351) || 
                           (code >= 8192 && code <= 8205) ||
                           (code >= 8208 && code <= 8223) ||
                           (code >= 8242 && code <= 8247);
                }

                static getLength(text, urlMode) {
                    if (urlMode === 'twitter') {
                        const normalized = text.normalize('NFC');
                        const masked = normalized.replace(this.REGEX_OBJ.URL_GLOBAL, 'x'.repeat(CONFIG.URL_WEIGHTS.TWITTER));
                        
                        let totalWeight = 0;
                        const iterator = this.segmenter.segment(masked)[Symbol.iterator]();
                        let result = iterator.next();
                        
                        while (!result.done) {
                            const segmentStr = result.value.segment;
                            const code = segmentStr.codePointAt(0);
                            totalWeight += this.isTwitterWeightOne(code) ? 1 : 2;
                            result = iterator.next();
                        }
                        return totalWeight;

                    } else if (urlMode === 'bluesky') {
                        return this.countBlueskyGraphemes(text);
                    }
                    return this.countGraphemes(text);
                }

                static format(chunk, options, current, total) {
                    const { position, format, customFormatStr } = options;
                    
                    if (format === 'link_bottom') {
                        if (current === 1 && total > 1) return `${chunk}\n\n원문 아래`;
                        return chunk;
                    }

                    if (format === 'google') {
                        const cleanChunk = chunk.replace(/\s+$/, '');
                        if (current === 1) {
                            return `${cleanChunk} 🧵`;
                        } else {
                            return `🧵(${current}/${total}) ${cleanChunk}`;
                        }
                    }

                    if (format === 'korean_cont') {
                        const cleanChunk = chunk.replace(/\s+$/, '');
                        if (total === 1) return cleanChunk;

                        const header = "(위에서 이어짐)\n\n";
                        const footer = "\n\n(계속)";

                        if (current === 1) return `${cleanChunk}${footer}`;
                        else if (current === total) return `${header}${cleanChunk}`;
                        else return `${header}${cleanChunk}${footer}`;
                    }

                    let numbering = '';
                    if (format === 'custom') {
                        numbering = (customFormatStr || '{current}/{total}')
                            .replaceAll('{current}', current)
                            .replaceAll('{total}', total);
                    } else {
                        const map = {
                            'bracket': `[${current}/${total}]`,
                            'simple': `${current}/${total}`,
                            'paren': `(${current}/${total})`,
                            'thread': `(🧵${current}/${total})`,
                            'memo': `(📝${current}/${total})`,
                            'finger': `(👇${current}/${total})`
                        };
                        numbering = map[format] || map['thread'];
                    }

                    const cleanChunk = chunk.replace(/\s+$/, '');
                    return position === 'front' 
                        ? `${numbering} ${cleanChunk}` 
                        : `${cleanChunk} ${numbering}`;
                }

                static split(text, limit, options) {
                    if (options.format === 'link_bottom') {
                        const match = text.match(/(https?:\/\/[^\s]+)/);
                        if (match) {
                            const url = match[0];
                            const title = text.substring(0, match.index).trim();
                            const body = text.substring(match.index + url.length).trim();
                            if (title && body) {
                                return [
                                    { text: body, isUnbreakable: false },
                                    { text: title + "\n\n" + url, isUnbreakable: false }
                                ];
                            }
                        }
                    }

                    const { urlMode, paragraphMode } = options;
                    const safeDivisor = Math.max(1, limit - 10);
                    let estimatedTotal = Math.ceil(this.getLength(text, urlMode) / safeDivisor) || 1;
                    let chunks = [];
                    let loopCount = 0;

                    while (loopCount < CONFIG.LOOP_LIMIT) {
                        const dummyNum = this.format("", options, estimatedTotal, estimatedTotal).trim();
                        const overhead = this.getLength(dummyNum, urlMode) + 1;
                        const safeLimit = limit - overhead;

                        if (safeLimit < 1) return this.runAlgo(text, Math.max(1, limit), urlMode);

                        chunks = paragraphMode === 'on' 
                            ? this.splitByPara(text, safeLimit, urlMode)
                            : this.runAlgo(text, safeLimit, urlMode);

                        const actualTotal = chunks.length;
                        if (String(actualTotal).length <= String(estimatedTotal).length) break;
                        estimatedTotal = actualTotal;
                        loopCount++;
                    }
                    return chunks;
                }

                static splitByPara(text, limit, urlMode) {
                    const paragraphs = text.split('\n');
                    const chunks = [];
                    let currentLen = 0;
                    let currentBuffer = ""; 

                    for (let i = 0; i < paragraphs.length; i++) {
                        const para = paragraphs[i];
                        const paraLen = this.getLength(para, urlMode);
                        const newlineCost = currentBuffer.length > 0 ? 1 : 0; 

                        if (paraLen > limit) {
                            if (currentBuffer.length > 0) {
                                chunks.push({ text: currentBuffer, isUnbreakable: false });
                                currentBuffer = "";
                                currentLen = 0;
                            }
                            const subChunks = this.runAlgo(para, limit, urlMode);
                            for (let j = 0; j < subChunks.length; j++) {
                                chunks.push(subChunks[j]);
                            }
                        } else {
                            if (currentLen + newlineCost + paraLen <= limit) {
                                if (currentBuffer.length > 0) currentBuffer += "\n";
                                currentBuffer += para;
                                currentLen += newlineCost + paraLen;
                            } else {
                                chunks.push({ text: currentBuffer, isUnbreakable: false });
                                currentBuffer = para;
                                currentLen = paraLen;
                            }
                        }
                    }
                    if (currentBuffer.length > 0) {
                        chunks.push({ text: currentBuffer, isUnbreakable: false });
                    }
                    return chunks;
                }

                static runAlgo(text, limit, urlMode) {
                    const chunks = [];
                    let start = 0;
                    const processedText = urlMode === 'twitter' ? text.normalize('NFC') : text;
                    const len = processedText.length;
                    const startTime = Date.now();
                    const regexSource = urlMode === 'bluesky' ? this.REGEX_OBJ.BLUESKY_LINK : this.REGEX_OBJ.URL_GLOBAL;
                    const matches = [...processedText.matchAll(new RegExp(regexSource))];
                    let urlIdx = 0;

                    while (start < len) {
                        if (Date.now() - startTime > CONFIG.TIMEOUT_MS) {
                            chunks.push({ text: processedText.substring(start), isUnbreakable: true }); 
                            break;
                        }

                        let currentWeight = 0;
                        let splitIdx = start;
                        let lastSafeSplitIdx = -1;
                        let isUnbreakable = false;
                        
                        const segIter = this.segmenter.segment(processedText.substring(start))[Symbol.iterator]();
                        let segResult = segIter.next();

                        while (!segResult.done) {
                            const seg = segResult.value;
                            const absStart = start + seg.index;
                            const segLen = seg.segment.length;
                            const absEnd = absStart + segLen;

                            let inUrl = false;
                            let currentUrlMatch = null;

                            while (urlIdx < matches.length && matches[urlIdx].index + matches[urlIdx][0].length <= absStart) {
                                urlIdx++;
                            }
                            
                            if (urlIdx < matches.length) {
                                const m = matches[urlIdx];
                                if (absStart >= m.index && absStart < m.index + m[0].length) {
                                    inUrl = true;
                                    currentUrlMatch = m;
                                }
                            }

                            if (inUrl) {
                                if (absStart === currentUrlMatch.index) {
                                    if (urlMode === 'twitter') {
                                        currentWeight += CONFIG.URL_WEIGHTS.TWITTER;
                                    } else if (urlMode === 'bluesky') {
                                        let cleanUrl = currentUrlMatch[0].replace(/^https?:\/\//i, '');
                                        let fullLen = this.countGraphemes(cleanUrl);
                                        let domain = cleanUrl.split('/')[0];
                                        let domainLen = this.countGraphemes(domain);
                                        let shortenedLen = domainLen + CONFIG.URL_WEIGHTS.BSKY_ADDED_LEN;
                                        currentWeight += (fullLen < shortenedLen) ? fullLen : shortenedLen;
                                    } else {
                                        currentWeight += this.countGraphemes(currentUrlMatch[0]);
                                    }
                                }
                            } else {
                                let charWeight = 1;
                                if (urlMode === 'twitter') {
                                    const code = seg.segment.codePointAt(0);
                                    charWeight = this.isTwitterWeightOne(code) ? 1 : 2;
                                }
                                currentWeight += charWeight;

                                if (/\s|[.!?]/.test(seg.segment)) {
                                    lastSafeSplitIdx = absEnd;
                                }
                            }

                            if (currentWeight > limit) {
                                if (inUrl && currentUrlMatch.index > start) {
                                    splitIdx = currentUrlMatch.index;
                                } else if (lastSafeSplitIdx > start) {
                                    splitIdx = lastSafeSplitIdx;
                                } else {
                                    splitIdx = absStart; 
                                    if (splitIdx === start) splitIdx = absEnd;
                                    isUnbreakable = true;
                                }
                                break;
                            }
                            
                            splitIdx = absEnd;
                            segResult = segIter.next();
                        }

                        chunks.push({ 
                            text: processedText.substring(start, splitIdx), 
                            isUnbreakable: isUnbreakable 
                        });

                        start = splitIdx;
                        while (start < len && /\s/.test(processedText[start]) && processedText[start] !== '\n') start++;
                        if (start < len && processedText[start] === '\n') start++;
                    }
                    return chunks;
                }
            }

            // 5. 애플리케이션 컨트롤러
            class AppController {
                constructor() {
                    this.dom = DOMHelper.getElements();
                    this.statusSpans = Array.from(this.dom.statusBar.querySelectorAll('span'));
                    
                    this.settings = {
                        limit: 300,
                        urlMode: 'off',
                        position: 'back',
                        paragraphMode: 'on',
                        format: 'thread',
                        customFormatStr: '',
                        theme: 'light'
                    };
                    this.debounceTimer = null;
                    
                    TextEngine.init();
                    this.init();
                }

                init() {
                    this.loadSettings();
                    this.bindEvents();
                    this.initDragAndDrop();
                    
                    DOMHelper.setText(this.dom.appTitle, "✂️ " + CONFIG.VERSION);
                    document.title = "✂️ " + CONFIG.VERSION;

                    if (this.dom.inputText.value) {
                        this.processText(true);
                        this.updateCount(this.dom.inputText.value);
                    }
                }

                loadSettings() {
                    try {
                        const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                        if (saved) {
                            this.settings = { ...this.settings, ...JSON.parse(saved) };
                        } else {
                            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                            this.settings.theme = prefersDark ? 'dark' : 'light';
                        }
                        const draft = localStorage.getItem(CONFIG.DRAFT_KEY);
                        if (draft) this.dom.inputText.value = draft;
                    } catch (e) { console.warn(e); }
                    this.applySettingsToDOM();
                }

                saveSettings() {
                    try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.settings)); } 
                    catch (e) { AppController.showToast(CONFIG.MESSAGES.STORAGE_ERROR); }
                }

                saveDraft(text) {
                    try { localStorage.setItem(CONFIG.DRAFT_KEY, text); } catch (e) {}
                }

                checkActivePreset() {
                    const s = this.settings;
                    let activePreset = '';
                    if (s.limit == CONFIG.LIMITS.TWITTER && s.urlMode === 'twitter') activePreset = 'twitter';
                    else if (s.limit == CONFIG.LIMITS.BLUESKY && s.urlMode === 'bluesky') activePreset = 'bluesky';
                    else if (s.limit == CONFIG.LIMITS.THREADS && s.urlMode === 'off') activePreset = 'threads';

                    this.dom.presetContainer.querySelectorAll('.preset-btn').forEach(b => DOMHelper.setClass(b, 'active', false));
                    if (activePreset) {
                        const target = document.getElementById(`btn-${activePreset}`);
                        DOMHelper.setClass(target, 'active', true);
                    }
                    return activePreset;
                }

                applySettingsToDOM() {
                    const s = this.settings;
                    if (this.dom.limitInput.value != s.limit) this.dom.limitInput.value = s.limit;
                    if (this.dom.urlModeSelect.value !== s.urlMode) this.dom.urlModeSelect.value = s.urlMode;
                    if (this.dom.positionSelect.value !== s.position) this.dom.positionSelect.value = s.position;
                    if (this.dom.paragraphModeSelect.value !== s.paragraphMode) this.dom.paragraphModeSelect.value = s.paragraphMode;
                    if (this.dom.numberFormatSelect.value !== s.format) this.dom.numberFormatSelect.value = s.format;
                    if (this.dom.customFormatInput.value !== s.customFormatStr) this.dom.customFormatInput.value = s.customFormatStr;
                    
                    if (s.format === 'custom') DOMHelper.setClass(this.dom.customFormatInput, 'show', true);
                    else DOMHelper.setClass(this.dom.customFormatInput, 'show', false);

                    if (this.dom.html.getAttribute('data-theme') !== s.theme) {
                        this.dom.html.setAttribute('data-theme', s.theme);
                        DOMHelper.setText(this.dom.themeToggle, s.theme === 'dark' ? '☀️' : '🌙');
                    }
                    this.checkActivePreset();
                }

                syncSettingsFromDOM() {
                    this.settings.limit = parseInt(this.dom.limitInput.value) || 300;
                    this.settings.urlMode = this.dom.urlModeSelect.value;
                    this.settings.position = this.dom.positionSelect.value;
                    this.settings.paragraphMode = this.dom.paragraphModeSelect.value;
                    this.settings.format = this.dom.numberFormatSelect.value;
                    this.settings.customFormatStr = this.dom.customFormatInput.value;
                    
                    if (this.settings.format === 'custom') DOMHelper.setClass(this.dom.customFormatInput, 'show', true);
                    else DOMHelper.setClass(this.dom.customFormatInput, 'show', false);

                    this.saveSettings();
                    this.checkActivePreset(); 
                    this.updateCount(this.dom.inputText.value);
                }

                bindEvents() {
                    this.dom.themeToggle.addEventListener('click', () => {
                        this.settings.theme = this.settings.theme === 'dark' ? 'light' : 'dark';
                        this.applySettingsToDOM();
                        this.saveSettings();
                    });

                    this.dom.presetContainer.addEventListener('click', (e) => {
                        const btn = e.target.closest('.preset-btn');
                        if (btn) this.setPreset(btn.dataset.preset);
                    });

                    [this.dom.limitInput, this.dom.positionSelect, this.dom.paragraphModeSelect, this.dom.urlModeSelect].forEach(el => {
                        el.addEventListener('change', () => {
                            this.syncSettingsFromDOM();
                            this.debounceProcess();
                        });
                    });

                    this.dom.numberFormatSelect.addEventListener('change', () => {
                        this.syncSettingsFromDOM();
                        this.debounceProcess();
                    });

                    this.dom.customFormatInput.addEventListener('input', () => {
                        this.syncSettingsFromDOM();
                        this.debounceProcess();
                    });

                    this.dom.limitInput.addEventListener('input', () => {
                        this.checkActivePreset(); 
                        this.debounceProcess();
                    });

					this.dom.inputText.addEventListener('input', (e) => {
						this.updateCount(e.target.value);
						this.saveDraft(e.target.value);

						// inputType이 'insertFromPaste'이면 붙여넣기 동작입니다.
						if (e.inputType === 'insertFromPaste') {
							// 기존 타이머 취소 (중복 실행 방지)
							if (this.debounceTimer) clearTimeout(this.debounceTimer);
							
							// 설정을 동기화하고, '자동 모드(true)'가 아닌 '수동 모드(false)'로 실행
							// false로 실행하면 자르기 버튼을 누른 것과 똑같이 인식되어 복사가 수행됩니다.
							this.syncSettingsFromDOM();
							this.processText(false); 
						} else {
							// 붙여넣기가 아니면(그냥 타이핑 등) 기존처럼 미리보기만 갱신
							this.debounceProcess();
						}
					});
					
                    this.dom.btnReset.addEventListener('click', () => this.resetAll());
                    this.dom.btnSplit.addEventListener('click', () => this.processText(false));

                    this.dom.btnFile.addEventListener('click', () => this.dom.fileInput.click());
                    this.dom.fileInput.addEventListener('change', (e) => this.handleFileUpload(e));

                    this.dom.resultsArea.addEventListener('click', (e) => {
                        const btn = e.target.closest('button');
                        if (!btn) return;
                        
                        if (btn.classList.contains('copy-btn')) {
                            ClipboardManager.copy(btn.dataset.content, btn);
                        } else if (btn.classList.contains('copy-all-btn')) {
                            const allText = this.getAllResultsText();
                            ClipboardManager.copy(allText, btn);
                        } else if (btn.classList.contains('download-btn')) {
                            this.downloadResults();
                        }
                    });

                    document.addEventListener('keydown', (e) => {
                        // Global Keyboard Shortcuts
                        
                        // Ctrl + Enter: Split
                        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                            e.preventDefault();
                            this.dom.btnSplit.click();
                            return;
                        }

                        // Ctrl + Shift + C: Copy All
                        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
                            e.preventDefault();
                            const copyAllBtn = this.dom.resultsArea.querySelector('.copy-all-btn');
                            if (copyAllBtn) copyAllBtn.click();
                            return;
                        }

                        // Ctrl + S: Save/Download
                        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                            e.preventDefault();
                            const downloadBtn = this.dom.resultsArea.querySelector('.download-btn');
                            if (downloadBtn) downloadBtn.click();
                            return;
                        }

                        // Alt + Delete: Reset
                        if (e.altKey && e.key === 'Delete') {
                            e.preventDefault();
                            this.dom.btnReset.click();
                            return;
                        }

                        // Ctrl + O: Open File
                        if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')) {
                            e.preventDefault();
                            this.dom.btnFile.click();
                            return;
                        }

                        // / (Slash): Focus Input
                        if (e.key === '/' && document.activeElement !== this.dom.inputText && document.activeElement.tagName !== 'INPUT') {
                            e.preventDefault();
                            this.dom.inputText.focus();
                            return;
                        }

                        // Alt + B: Bluesky
                        if (e.altKey && (e.key === 'b' || e.key === 'B')) {
                            e.preventDefault();
                            this.setPreset('bluesky');
                            return;
                        }

                        // Alt + X: Twitter
                        if (e.altKey && (e.key === 'x' || e.key === 'X')) {
                            e.preventDefault();
                            this.setPreset('twitter');
                            return;
                        }

                        // Alt + T: Threads
                        if (e.altKey && (e.key === 't' || e.key === 'T')) {
                            e.preventDefault();
                            this.setPreset('threads');
                            return;
                        }
                        
                        // Alt + D: Dark Mode
                        if (e.altKey && (e.key === 'd' || e.key === 'D')) {
                            e.preventDefault();
                            this.dom.themeToggle.click();
                            return;
                        }
                    });
                }

                initDragAndDrop() {
                    const zone = this.dom.inputText;
                    const prevent = e => { e.preventDefault(); e.stopPropagation(); };
                    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
                        zone.addEventListener(e, prevent);
                        document.body.addEventListener(e, prevent);
                    });
                    
                    zone.addEventListener('dragenter', () => DOMHelper.setClass(zone, 'drag-over', true));
                    zone.addEventListener('dragover', () => DOMHelper.setClass(zone, 'drag-over', true));
                    zone.addEventListener('dragleave', () => DOMHelper.setClass(zone, 'drag-over', false));
                    
                    zone.addEventListener('drop', (e) => {
                        DOMHelper.setClass(zone, 'drag-over', false);
                        const file = e.dataTransfer.files[0];
                        this.readFile(file);
                    });
                }

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    this.readFile(file);
                    e.target.value = '';
                }

                readFile(file) {
                    if (file && (file.type === "text/plain" || file.name.endsWith('.txt'))) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            this.dom.inputText.value = ev.target.result;
                            this.saveDraft(this.dom.inputText.value);
                            this.updateCount(this.dom.inputText.value);
                            this.debounceProcess();
                        };
                        reader.readAsText(file);
                    } else if (file) {
                        AppController.showToast(CONFIG.MESSAGES.FILE_ERROR);
                    }
                }

				setPreset(platform) {
                    if (platform === 'bluesky') {
                        this.dom.limitInput.value = CONFIG.LIMITS.BLUESKY;
                        this.dom.urlModeSelect.value = 'bluesky';
                        this.dom.numberFormatSelect.value = 'thread';
                    } else if (platform === 'twitter') {
                        this.dom.limitInput.value = CONFIG.LIMITS.TWITTER;
                        this.dom.urlModeSelect.value = 'twitter';
                        this.dom.numberFormatSelect.value = 'link_bottom';
                    } else if (platform === 'threads') {
                        this.dom.limitInput.value = CONFIG.LIMITS.THREADS;
                        this.dom.urlModeSelect.value = 'off';
                        this.dom.numberFormatSelect.value = 'thread';
                    }
                    
                    this.syncSettingsFromDOM();
                    this.processText(true);
                    this.updateCount(this.dom.inputText.value);
                    AppController.showToast(`⚙️ ${this.dom.limitInput.value}${CONFIG.MESSAGES.SETTINGS_DONE}`);
                }

                updateCount(text) {
                    const len = text.length; 
                    DOMHelper.setText(this.dom.totalCount, `현재: ${len.toLocaleString()}자`);

                    DOMHelper.setStyle(this.dom.bskyCount, 'display', 'none');
                    DOMHelper.setStyle(this.dom.twitterCount, 'display', 'none');

                    if (len === 0) return;

                    const currentPreset = this.checkActivePreset();
                    if (currentPreset === 'twitter') {
                        const twitterLen = TextEngine.getLength(text, 'twitter');
                        const status = twitterLen <= CONFIG.LIMITS.TWITTER ? '✅' : '❌';
                        DOMHelper.setText(this.dom.twitterCount, `🐦 트위터: ${twitterLen.toLocaleString()}자 ${status}`);
                        DOMHelper.setStyle(this.dom.twitterCount, 'display', 'block');
                    } else if (currentPreset === 'bluesky') {
                        const bskyLen = TextEngine.countBlueskyGraphemes(text);
                        const status = bskyLen <= CONFIG.LIMITS.BLUESKY ? '✅' : '❌';
                        DOMHelper.setText(this.dom.bskyCount, `🦋 블루스카이: ${bskyLen.toLocaleString()}자 ${status}`);
                        DOMHelper.setStyle(this.dom.bskyCount, 'display', 'block');
                    }
                }

                debounceProcess() {
                    if (this.debounceTimer) clearTimeout(this.debounceTimer);
                    this.debounceTimer = setTimeout(() => {
                        this.syncSettingsFromDOM();
                        this.processText(true);
                    }, CONFIG.DEBOUNCE_MS);
                }

                resetAll() {
                    this.dom.inputText.value = "";
                    this.saveDraft("");
                    this.updateCount("");
                    this.renderResults([]);
                    this.updateStatusBar(0, 0);
                    this.dom.inputText.focus();
                    AppController.showToast(CONFIG.MESSAGES.RESET_DONE);
                }

                processText(isAuto) {
                    const text = this.dom.inputText.value.trim();
                    const limit = this.settings.limit;

                    if (!text) {
                        if (!isAuto) AppController.showToast(CONFIG.MESSAGES.EMPTY_INPUT);
                        this.renderResults([]);
                        this.updateStatusBar(0, 0);
                        return;
                    }
                    if (limit < CONFIG.LIMITS.MIN) {
                        if (!isAuto) AppController.showToast(CONFIG.MESSAGES.LIMIT_ERROR);
                        return;
                    }

                    const chunks = TextEngine.split(text, limit, this.settings);
                    this.renderResults(chunks, isAuto);
                    this.updateStatusBar(text.length, chunks.length, text);
                }

                updateStatusBar(chars, chunksCount, text = "") {
                    const words = text ? text.trim().split(/\s+/).filter(w => w.length > 0).length : 0;
                    const lines = text ? text.split(/\r\n|\r|\n/).length : 0;
                    const paras = text ? text.trim().split(/\n\n+/).length : 0;
                    const sec = Math.ceil(chars / 500 * 60);
                    const timeText = sec < 60 ? `${sec}초` : `${Math.floor(sec/60)}분 ${sec%60}초`;

                    const values = [
                        `${chars.toLocaleString()}자`,
                        `${words.toLocaleString()}개`,
                        `${lines.toLocaleString()}줄`,
                        `${paras.toLocaleString()}개`,
                        timeText,
                        `${chunksCount}개`
                    ];

                    requestAnimationFrame(() => {
                        values.forEach((val, index) => {
                            if (this.statusSpans[index]) {
                                DOMHelper.setText(this.statusSpans[index], val);
                            }
                        });
                    });
                }

                renderResults(chunks, isAuto) {
                    const frag = document.createDocumentFragment();
                    let hasUnbreakable = false;

                    if (chunks.length === 0) {
                        const div = DOMHelper.createElement('div', 'empty-state');
                        const p = DOMHelper.createElement('div');
                        const lines = CONFIG.MESSAGES.EMPTY_STATE.split('<br>');
                        lines.forEach((line, index) => {
                            p.appendChild(document.createTextNode(line));
                            if (index < lines.length - 1) {
                                p.appendChild(document.createElement('br'));
                            }
                        });
                        div.appendChild(p);
                        frag.appendChild(div);
                    } else {
                        const actionDiv = DOMHelper.createElement('div', 'results-header-actions');
                        // Added keyboard hints dynamically to these buttons
                        const copyAll = DOMHelper.createElement('button', 'copy-all-btn');
                        copyAll.innerHTML = `<span class="btn-title">${CONFIG.MESSAGES.COPY_ALL}</span><span class="btn-meta"><span class="kbd-hint">Ctrl+Shift+C</span></span>`;
                        
                        const downloadBtn = DOMHelper.createElement('button', 'download-btn');
                        downloadBtn.innerHTML = `<span class="btn-title">${CONFIG.MESSAGES.SAVE_FILE}</span><span class="btn-meta"><span class="kbd-hint">Ctrl+S</span></span>`;
                        
                        actionDiv.append(copyAll, downloadBtn);
                        frag.appendChild(actionDiv);

                        chunks.forEach((chunkObj, i) => {
                            const chunkText = chunkObj.text;
                            if (chunkObj.isUnbreakable) hasUnbreakable = true;
                            
                            const current = i + 1;
                            const formatted = TextEngine.format(chunkText, this.settings, current, chunks.length);

                            const metaInfo = {
                                content: formatted,
                                current: current,
                                realLen: TextEngine.countGraphemes(formatted),
                                weightLen: TextEngine.getLength(formatted, this.settings.urlMode),
                                isUnbreakable: chunkObj.isUnbreakable,
                                urlMode: this.settings.urlMode
                            };

                            const card = DOMHelper.createCard(chunkText, metaInfo);
                            if (!isAuto) card.style.animationDelay = `${i * 0.05}s`;
                            frag.appendChild(card);
                        });
                    }

                    this.dom.resultsArea.replaceChildren(frag);

                    if (hasUnbreakable && !isAuto) {
                        AppController.showToast(CONFIG.MESSAGES.UNBREAKABLE);
                    } else if (!isAuto && chunks.length > 0) {
                        const first = this.dom.resultsArea.querySelector('.copy-btn');
                        if (first) ClipboardManager.copy(first.dataset.content, first);
                        AppController.showToast(CONFIG.MESSAGES.SPLIT_DONE);
                    }
                }

                getAllResultsText() {
                    return Array.from(this.dom.resultsArea.querySelectorAll('.copy-btn'))
                        .map(b => b.dataset.content).join('\n\n');
                }

                downloadResults() {
                    const text = this.getAllResultsText();
                    if (!text) return;
                    const blob = new Blob([text], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `thread_tailor_${new Date().toISOString().slice(0,10)}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                }

                static showToast(msg) {
                    const toast = document.getElementById('toast');
                    if (toast.timer) clearTimeout(toast.timer);
                    DOMHelper.setClass(toast, "show", false);
                    void toast.offsetWidth;
                    DOMHelper.setText(toast, msg);
                    DOMHelper.setClass(toast, "show", true);
                    toast.timer = setTimeout(() => DOMHelper.setClass(toast, "show", false), 3000);
                }
            }

            new AppController();

        })();
    </script>
</body>
</html>
